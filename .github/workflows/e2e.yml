name: E2E / Promotion Acceptance

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-acceptance:
    name: runtime-integration-acceptance
    if: >-
      (github.event_name == 'pull_request' &&
       github.base_ref == 'test' &&
       github.head_ref == 'dev') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/test')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integrated QuickJS runtime smoke
        run: pnpm smoke
