[workspace]
resolver = "2"
members = [
  "crates/sn-core",
  "crates/sn-runtime",
  "crates/sn-layout",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
rquickjs = { version = "=0.14.0", features = ["loader"] }
taffy = { version = "=0.15.1", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "calc", "content_size"] }
thiserror = "=2.0.21"
